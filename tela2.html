<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8">
    <title>Blog da Lare</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=<header class="navbar">
       
            
    <title>Document</title>
</head>
<body>
    <header class="navbar">
         <div class="nav-container">
            <span class="logo">𝕭𝖑𝖔𝖌 𝖉𝖆 𝕷𝖆𝖗𝖊</span>
            <div class="search-bar">      
            </div>
            <nav class="nav-links">
                <a href="index.html">⛧ Voltar ao Inicío ⛧</a> 
            </nav>
        </div>
    </header>

     <footer class="bottom-form-container">
        <div class="form-box">
            <h3>Converse com a IA:
            </h3>
           
      <form id="meu-form">
        <div>
          <label for="email">Digite seu email</label>
          <input type="email" id="email" required>
        </div>
        <div>
          <label for="message">Digite:</label>
          <textarea id="message" required></textarea>
        </div>
        </label>
        <button type="submit">Send</button>
      </form>


    <p id="texto-post">★</p>


     <script>
      const form = document.getElementById('meu-form');
      const textoPost = document.getElementById('texto-post');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        textoPost.innerText = "★ A IA está pensando...";

        // Faz a requisição direto para o Webhook de PRODUÇÃO do n8n
        const response = await fetch('https://laressa.app.n8n.cloud/webhook/143b95ad-2874-4821-9f2e-8f49eebf8fc4', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
          })
        });

        // Pede para o navegador ler a resposta como texto puro
        const text = await response.text();

        // Substitui o texto pela resposta da IA!
        textoPost.innerHTML = marked.parse(text);
      });
    </script>
</body>
</html>
